services:
  mysql:
    image: mysql:8.4
    container_name: nexus-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexus}
      MYSQL_USER: ${MYSQL_USER:-nexus_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexus_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - nexus_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "nexus_user", "-pnexus_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nexus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-nexus_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-nexus_pass}
      AI_API_KEY: ${AI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    networks:
      - nexus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    networks:
      - nexus-network

volumes:
  nexus_mysqldata:
    driver: local

networks:
  nexus-network:
    driver: bridge
